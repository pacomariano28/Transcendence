name: songuess

services:
  nginx:
    image: nginx:1.28.2-alpine3.23
    container_name: songuess-nginx
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "8443:443"
    networks:
      - songuess-net
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../infra/nginx/conf.d:/etc/nginx/conf.d
      - ../infra/certs:/etc/nginx/certs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    env_file:
      - ./frontend/.env
    container_name: songuess-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"
    networks:
      - songuess-net
    volumes:
      # - ./frontend/src:/app/src
      # - ./frontend/public:/app/public
      - ./frontend:/app
      - /app/node_modules

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    env_file:
      - ./backend/api-gateway/.env
    container_name: songuess-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - content-service
      - playlist-service
    ports:
      - "4000:4000"
    networks:
      - songuess-net
    volumes:
      # - ./backend/services/api-gateway/src:/app/src
      # - ./backend/services/api-gateway/tsconfig.json:/app/tsconfig.json
      - ./backend/api-gateway:/app
      - /app/node_modules

  game-service:
    build:
      context: ./backend/game-service
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    env_file:
      - ./backend/game-service/.env
    container_name: songuess-game-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    networks:
      - songuess-net
    volumes:
      # - ./backend/services/game-service/src:/app/src
      # - ./backend/services/game-service/tsconfig.json:/app/tsconfig.json
      - ./backend/game-service:/app
      - /app/node_modules

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 4002
      SERVICE_NAME: auth-service
      # DATABASE_URL: postgresql://...  (lo añadimos cuando conectemos DB)
      # JWT_SECRET: ...                (lo añadimos cuando implementemos login)
    env_file:
      - ./backend/auth-service/.env
    container_name: songuess-auth-service
    #entrypoint: "tail -f"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4002:4002"
    networks:
      - songuess-net
    volumes:
      # - ./backend/services/auth-service/src:/app/src
      # - ./backend/services/auth-service/tsconfig.json:/app/tsconfig.json
      - ./backend/auth-service:/app
      - /app/node_modules

  content-service:
    build:
      context: ./backend/content-service
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    env_file:
      - ./backend/content-service/.env
    container_name: songuess-content-service
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "4003:4003"
    networks:
      - songuess-net
    volumes:
      # - ./backend/services/content-service/src:/app/src
      # - ./backend/services/content-service/tsconfig.json:/app/tsconfig.json
      - ./backend/content-service:/app
      - /app/node_modules

  playlist-service:
    build:
      context: ./backend/playlist-service
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 4004
      SERVICE_NAME: playlist-service
    env_file:
      - ./backend/playlist-service/.env
    container_name: songuess-playlist-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    networks:
      - songuess-net
    volumes:
      - ./backend/playlist-service:/app
      - /app/node_modules

  # nginx-reload:
  #   image: alpine:latest
  #   volumes:
  #     - ../infra/nginx:/nginx:ro
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: |
  #     sh -c "apk add --no-cache inotify-tools docker-cli && \
  #     inotifywait -r -m -e modify /nginx | while read -r path action file; do \
  #       echo 'Recargando nginx...'; \
  #       docker exec songuess-nginx nginx -s reload; \
  #     done"
  #   depends_on:
  #     - nginx
  #   networks:
  #     - songuess-net

  postgres:
    image: postgres:17.9-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
    container_name: songuess-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - songuess-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-postgres_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.4.2-alpine3.22
    container_name: songuess-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - songuess-net
    volumes:
      - redis_data:/data

networks:
  songuess-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
